version: "3.8"

# Sovereign AI Workbench - Infrastructure Services
#
# SECURITY: sovereign-net is an INTERNAL Docker network.
# Containers on this network can communicate with each other
# but have NO route to the public internet.
# This enforces egress isolation at the container/network level
# without requiring iptables or root.

services:
  # PostgreSQL database for metadata, user management, and configuration
  postgres:
    image: postgres:16-alpine
    container_name: sovereign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sovereign_ai
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign -d sovereign_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sovereign-net

  # Qdrant vector database for knowledge index / RAG
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: sovereign-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sovereign-net

  # Agent process: FastAPI app on private internal network.
  # Can reach postgres and qdrant via sovereign-net.
  # CANNOT reach the public internet (sovereign-net is internal).
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: sovereign-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HARDWARE_TIER: ${HARDWARE_TIER:-BUILD}
      POSTGRES_HOST: sovereign-postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: sovereign-qdrant
      QDRANT_PORT: 6333
    cap_drop:
      - NET_RAW  # Drop raw socket capability for security
    networks:
      - sovereign-net
    depends_on:
      - postgres
      - qdrant

volumes:
  postgres_data:
  qdrant_data:

networks:
  sovereign-net:
    driver: bridge
    internal: true  # NO route to public internet from this network
